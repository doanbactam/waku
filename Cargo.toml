[package]
name = "waku"
version = "0.0.8"
edition = "2024"
description = "A fast, native control plane for local coding agents"
license = "GPL-3.0-only"

[dependencies]
agent-client-protocol = "2.0.0"
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WKWebView. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["test-support"] }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "font-kit",
    "wayland",
    "x11",
] }
parking_lot = "0.12"
rquickjs = "0.12.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
pulldown-cmark = "0.13"
regex = "1"
rust-i18n = "4"
rust-umami = "0.1.1"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
# `libc::kill`/`libc::SIGKILL` is reached from `git_commit.rs` under
# `cfg(unix)`, so the crate is needed on Linux as well as macOS.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Native Linux Computer Use: AT-SPI2 for semantic targets and the XDG
# Screenshot portal for Wayland-safe capture. Keep the event loop on async-io
# so the helper does not introduce a second Tokio runtime.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "remote_desktop", "screencast", "screenshot"] }
atspi = { version = "0.29", default-features = false, features = ["connection", "proxies"] }
zbus = { version = "5.5", default-features = false, features = ["async-io"] }
enumflags2 = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
image = "0.25"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# wry drives the native browser surface. macOS uses WKWebView via
# `WebViewExtMacOS`; Windows uses WebView2 via `build_as_child(HWND)`.
# Linux is gated off because GPUI exposes Xcb/Wayland handles that wry's
# raw-handle path does not support (it needs Xlib or a GTK container).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.56", features = ["devtools"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# Matches the version GPUI itself renders with, so RenderImage frames are the
# same `image` types.
image = "0.25"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
